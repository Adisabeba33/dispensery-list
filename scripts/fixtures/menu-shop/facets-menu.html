<!doctype html><meta charset="utf-8"><title>Menu — Fifth Fixture Dispensary</title>
<div id="gate"><h1>Are you 21 or older?</h1><button id="yes">Yes, I am 21</button></div>
<div id="menu">loading…</div>
<script>
  document.getElementById('yes').onclick = async () => {
    document.getElementById('gate').style.display = 'none';
    const r = await fetch('/api/facets.json?page=0&perPage=3');
    const j = await r.json();
    document.getElementById('menu').textContent = j.data.products.length + ' products';
  };
</script>
