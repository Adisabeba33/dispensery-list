<!doctype html><meta charset="utf-8"><title>Menu — Eleventh Fixture Dispensary</title>
<div id="gate"><h1>Are you 21 or older?</h1><button id="yes">Yes, I am 21</button></div>
<div id="menu">loading…</div>
<script>
  document.getElementById('yes').onclick = async () => {
    document.getElementById('gate').style.display = 'none';
    const r = await fetch('/api/search.json');
    const j = await r.json();
    document.getElementById('menu').textContent = j.hits.hits.length + ' hits';
  };
</script>
