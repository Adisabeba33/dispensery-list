<!doctype html><meta charset="utf-8"><title>Menu — Fourteenth Fixture Dispensary</title>
<style>
  button { display: block; margin: 8px; padding: 12px 24px; }
  #age { position: fixed; inset: 0; background: #fff; display: flex;
         flex-direction: column; align-items: center; justify-content: center; }
</style>

<!-- DISPO/BK serves it exactly this way: the age wall on top, and the words
     "Choose your store." already on the page behind it. Read without
     answering the wall first, the fork is the wall's own two buttons. -->
<div id="age">
  <h1>Are you 21 or older?</h1>
  <button id="yes">YES, I'M 21+</button>
  <button id="no">I'M UNDER 21</button>
</div>

<!-- The site's own navigation, which stands on the page beside the fork and
     has a town in it. Read as branches of the chain, BROOKLYN here is a link
     to a marketing page and ORDER NOW is a checkout: DISPO/BK served exactly
     this, and the fork read all eight of them. The question's own group is
     the only thing that may be answered. -->
<nav>
  <a href="/nowhere">SHOP</a>
  <a href="/nowhere">LOCATIONS</a>
  <a href="/nowhere" id="nav-bk">BROOKLYN</a>
  <a href="/nowhere">ORDER NOW</a>
</nav>

<h2>Welcome to the neighborhood.</h2>
<div id="fork">
  <h3>Choose your store.</h3>
  <button id="a">Brooklyn</button>
  <button id="b">Minneapolis</button>
  <button id="c">St Paul</button>
</div>
<div id="menu">loading…</div>
<script>
  /* Only this licence's own shop serves a shelf, and only if the age question
     was answered honestly. Two strains coming back is proof of both. */
  let poisoned = false;
  const shelf = async (ours) => {
    const r = await fetch(ours && !poisoned ? '/api/products.json?page=0&perPage=5' : '/api/empty.json');
    const j = await r.json();
    document.getElementById('menu').textContent = (j.data.products || []).length + ' products';
  };
  yes.onclick = () => { document.getElementById('age').style.display = 'none'; };
  no.onclick = () => { poisoned = true; document.getElementById('age').style.display = 'none'; };
  for (const link of document.querySelectorAll('nav a')) {
    link.onclick = (e) => { e.preventDefault(); poisoned = true; };
  }
  a.onclick = () => shelf(true);
  b.onclick = () => shelf(false);
  c.onclick = () => shelf(false);
</script>
