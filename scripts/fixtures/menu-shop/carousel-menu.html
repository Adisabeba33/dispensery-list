<!doctype html><meta charset="utf-8"><title>Menu — Sixth Fixture Dispensary</title>
<div id="gate"><h1>Are you 21 or older?</h1><button id="yes">Yes, I am 21</button></div>
<div id="menu">loading…</div>
<script>
  document.getElementById('yes').onclick = async () => {
    document.getElementById('gate').style.display = 'none';
    // The carousels come first and carry more, exactly as the real ones do.
    const c = await (await fetch('/api/carousels.json')).json();
    const l = await (await fetch('/api/list.json?page=0&perPage=2')).json();
    document.getElementById('menu').textContent =
      c.reduce((n, x) => n + x.products.length, 0) + ' + ' + l.data.products.length;
  };
</script>
