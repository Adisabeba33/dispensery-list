name: Menu collect (plain HTTP)

# The browser collector exists because fetching HTML got nothing: those
# storefronts ship products:{data:[], params:{}} and fill the shelf after the
# page loads. That is true of the engine it was written against — and not of
# the one the probe found on 2026-09-11, which serves twenty products straight
# into __NEXT_DATA__ under products.data.objects.
#
# So this runs the plain-HTTP collector, with no Playwright and no browser, to
# find out how many shops are reachable the cheap way. It writes nothing: the
# run reports what it would collect, and committing listings stays a decision
# someone makes on purpose.

on:
  push:
    branches:
      - claude/missing-varieties-research-hiwj4r
    paths:
      - scripts/menu-collect.py
      - scripts/menu_shapes.py
      - .github/workflows/menu-collect-http.yml
  workflow_dispatch:
    inputs:
      limit:
        description: How many shops to visit
        default: '120'
      only:
        description: Comma-separated name or licence substrings; visit only those shops
        default: ''

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect, without writing
        env:
          EVENT: ${{ github.event_name }}
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
          # The shops the probe found serving products in plain HTML. Empty
          # this out to let a pushed run visit every eligible shop.
          COLLECT_FOCUS: "flowery,happy alta,terp bros,art of flower,pryzm"
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then
            ONLY="$COLLECT_FOCUS"
          fi
          args=(--dry-run --limit "${LIMIT:-120}")
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          echo "running: python scripts/menu-collect.py ${args[*]}"
          python scripts/menu-collect.py "${args[@]}"
