name: Menu endpoint audit

on:
  push:
    branches:
      - agent/menu-endpoints-nyc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install audit dependencies
        run: python -m pip install requests
      - name: Validate curated endpoint file
        run: python scripts/validate-menu-endpoints.py
      - name: Validate repository data
        run: |
          npm ci
          npm run validate
      - name: Audit candidate menu endpoints
        run: python scripts/menu-endpoint-audit.py
      - name: Upload endpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: menu-endpoint-audit
          path: enrichment-output/menu-endpoint-audit.json
          if-no-files-found: error
          retention-days: 7
