name: Add Doobie Blueberry Muffin COA reference once

on:
  push:
    branches:
      - agent/menu-endpoints-nyc
    paths:
      - .github/workflows/add-doobie-blueberry-muffin-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/menu-endpoints-nyc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Append, validate, and commit verified Blueberry Muffin reference
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/menu-endpoints-nyc
            git reset --hard origin/agent/menu-endpoints-nyc
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/strain-reference.json')
          data = json.loads(path.read_text())
          if any(x.get('strainId') == 'blueberry-muffin' for x in data):
              print('Blueberry Muffin already present; no change needed.')
              raise SystemExit(0)

          data.append({
            "strainId": "blueberry-muffin",
            "canonicalName": "Blueberry Muffin",
            "aliases": ["Blueberry Muffin", "Doobie Labs - Blueberry Muffin"],
            "lineage": "UNKNOWN",
            "parents": None,
            "profile": [
              {"name": "LINALOOL", "medianPercent": 0.35, "observations": 1},
              {"name": "LIMONENE", "medianPercent": 0.30, "observations": 1},
              {"name": "CARYOPHYLLENE", "medianPercent": 0.21, "observations": 1},
              {"name": "MYRCENE", "medianPercent": 0.12, "observations": 1},
              {"name": "FARNESENE", "medianPercent": 0.10, "observations": 1},
              {"name": "FENCHOL", "medianPercent": 0.08, "observations": 1},
              {"name": "TERPINEOL", "medianPercent": 0.08, "observations": 1},
              {"name": "NEROLIDOL_TRANS", "medianPercent": 0.07, "observations": 1}
            ],
            "basis": {
              "kind": "AGGREGATED_COA",
              "sampleCount": 1,
              "datasetName": None,
              "datasetLicence": None,
              "notes": "Single direct Green Analytics NY full-compliance whole-flower COA for Doobie Labs Blueberry Muffin 3.5g, processed by AP Cohen Licensing Inc. dba 1Off, sample 20260124-1OFF-032 / batch 1O-8F-DL26-BLBMF, sampled 2026-01-24 and reported 2026-02-02. Stored as a LOW-confidence seed reference only; one batch is not representative of all Blueberry Muffin lots. Only quantified terpene detections are retained; <MRL results are omitted rather than coerced to zero. The retained printed analytes sum to 1.31% while the certificate prints Total Terpenes 1.30%; the project preserves the individual laboratory results and does not alter one merely to force the printed total. The certificate does not explicitly classify the cultivar as Indica/Sativa/Hybrid, so lineage remains UNKNOWN."
            },
            "confidence": "LOW",
            "sources": [
              {
                "url": "https://app.alleaves.com/api/inventory/batch/buddega/coa/22355.pdf",
                "label": "Green Analytics NY — Doobie Labs Blueberry Muffin 3.5g / 20260124-1OFF-032 / 1O-8F-DL26-BLBMF — reported 2026-02-02",
                "retrievedAt": "2026-09-07T12:20:00Z"
              }
            ],
            "lastUpdated": "2026-09-07T12:20:00Z"
          })

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

            if git diff --quiet -- data/strain-reference.json; then
              echo 'No data change to commit.'
              exit 0
            fi

            npm run validate
            git config user.name 'Adisabeba33'
            git config user.email 'lezzgo2@gmail.com'
            git add data/strain-reference.json
            git commit -m 'research: add Doobie Blueberry Muffin COA profile'
            if git push origin HEAD:agent/menu-endpoints-nyc; then
              exit 0
            fi
            echo "Push raced with another update; retrying from latest branch (attempt ${attempt}/5)."
          done
          echo 'Could not push after 5 attempts.' >&2
          exit 1
