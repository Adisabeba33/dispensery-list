name: Menu probe

# The probe needs outbound HTTPS, which a sandboxed agent session does not
# have. So it runs here, where a runner does — the same arrangement the
# endpoint audit already uses. Nothing is committed: the probe writes only to
# enrichment-output/, which is gitignored, and the report leaves as an
# artifact.

on:
  # GitHub only offers the "Run workflow" button for files that sit on the
  # default branch, so on a working branch the dispatch trigger alone is
  # unreachable. A push trigger is not: it runs the file from the ref that was
  # pushed. Narrowed by paths so ordinary commits on this branch do not send a
  # crawler at eighty-three real shops — only a change to the probe itself
  # earns a run.
  push:
    branches:
      - claude/missing-varieties-research-hiwj4r
    paths:
      - scripts/menu-probe.py
      - .github/workflows/menu-probe.yml
  workflow_dispatch:
    inputs:
      only_untried:
        description: Only shops no pass has ever reached (step 0 of the coverage plan)
        type: boolean
        default: true
      sweep_all:
        description: Sweep every eligible shop instead of sampling
        type: boolean
        default: true
      limit:
        description: Sample size when not sweeping all
        default: '60'
      only:
        description: Comma-separated name or licence substrings; probe only those shops
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Probe menus
        # The arguments are assembled in the shell, not in a ${{ }} ternary.
        # A push event carries no dispatch inputs at all, so the expression
        # form produced "--limit" with nothing after it; and GitHub's
        # `cond && x || y` cannot carry a false boolean through, so an
        # unchecked box would have read as the default. Both are avoided by
        # passing the raw values in and deciding here.
        env:
          EVENT: ${{ github.event_name }}
          # A pushed run answers whatever question the last commit raised. When
          # that question is about one engine, it does not need eighty-three
          # shops: three sweeps in thirteen hours already cost us accuracy, the
          # reachable count falling and robots refusals rising as the hosts'
          # defences warmed to a datacentre address. Empty this back out when
          # the diagnosis lands, and pushes sweep again.
          PROBE_FOCUS: "flowery,happy alta,terp bros,art of flower,housing works,weed shoppe,pryzm"
          SWEEP_ALL: ${{ inputs.sweep_all }}
          ONLY_UNTRIED: ${{ inputs.only_untried }}
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then
            # Pushed, not dispatched: run step 0 of the coverage plan, unless
            # a focus is set, in which case answer that question instead.
            SWEEP_ALL=true
            ONLY="$PROBE_FOCUS"
            if [ -z "$ONLY" ]; then
              ONLY_UNTRIED=true
            fi
          fi
          args=()
          if [ "$SWEEP_ALL" = "true" ]; then
            args+=(--all)
          else
            args+=(--limit "${LIMIT:-60}")
          fi
          if [ "$ONLY_UNTRIED" = "true" ]; then
            args+=(--only-untried)
          fi
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          echo "running: python scripts/menu-probe.py ${args[*]}"
          python scripts/menu-probe.py "${args[@]}"
      # Read before the artifact is downloaded: the summary is the whole point,
      # and it is short.
      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = 'enrichment-output/menu-probe.json'
          if not os.path.exists(path):
              print('The probe wrote no report — it failed before finishing.')
              raise SystemExit(0)
          d = json.load(open(path))
          print(json.dumps(d['summary'], indent=2)[:4000])

          # Which shops answered, and with what. A platform named here is a
          # platform we no longer have to guess at.
          print('\n--- per shop ---')
          for r in d['records']:
              state = 'ok' if not r.get('error') else str(r['error'])[:40]
              kinds = ','.join(sorted({s.get('kind') for s in r.get('structures', []) if s.get('kind')})) or '-'
              print(f"{r.get('provider') or '?':<12} {state:<41} "
                    f"{'flower' if r.get('flowerWordsSeen') else '      '} "
                    f"{kinds:<28} {r.get('name', '')[:30]}")

          # Last, deliberately. A reader — human or agent — reaches a long log
          # from its end, and the numbers that decide the next move were
          # sitting two hundred lines up behind the JSON-LD key dumps.
          s = d['summary']
          print('\n--- headline ---')
          print(f"eligible {s['eligibleShops']} · probed {s['probed']} · reachable {s['reachable']}")
          print(f"robots: disallowed {s.get('robotsDisallowed')} · unknown {s.get('robotsUnknown')}")
          print(f"structures: {s.get('structuresFound')}")
          print(f"products field: {s.get('productsFieldShape')}")
          print(f"shops with a product list in the HTML: {s.get('shopsWithProductList')}")
          PY
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-probe
          path: enrichment-output/menu-probe.json
          if-no-files-found: error
          retention-days: 7
