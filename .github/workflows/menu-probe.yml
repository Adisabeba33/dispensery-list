name: Menu probe

on:
  push:
    branches:
      - agent/menu-flower-nyc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Probe real dispensary menus
        run: python scripts/menu-probe.py --limit 60
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: menu-probe
          path: enrichment-output/menu-probe.json
          if-no-files-found: error
          retention-days: 7
