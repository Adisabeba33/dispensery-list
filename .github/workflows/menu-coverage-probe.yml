name: Coverage probe

# Одноразовая диагностика по магазинам, про которые есть конкретный вопрос.
# Ничего не коммитит и никуда не публикует — только читает и печатает в лог.
# Живёт на ветке и уезжает вместе с ней; запускается пушем, потому что кнопка
# «Run workflow» появляется только у файлов на ветке по умолчанию.
on:
  push:
    branches:
      - claude/menu-coverage
    # Только когда меняется сама проба: иначе каждый коммит в ветку заново
    # ходит по чужим сайтам, чтобы напечатать то же самое.
    paths:
      - .github/workflows/menu-coverage-probe.yml
  workflow_dispatch:
    inputs:
      licences:
        description: Лицензии через запятую
        default: OCM-CAURD-23-000009,OCM-CAURD-23-000023

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Read the shops with the diagnostics turned on
        env:
          # Gotham Bowery объявляет 83 товара и отдаёт 20, Gotham Buds
          # объявляет 131 и отдаёт 79. Оба останавливаются после первого
          # круга прокрутки — значит меню листается, а не подгружается. Нужен
          # адрес запроса и то, что в нём спрашивают.
          LICENCES: ${{ inputs.licences || 'OCM-CAURD-23-000009,OCM-CAURD-23-000023' }}
        run: node scripts/menu-render.mjs --only "$LICENCES" --dump-requests 6

      - name: What the collector saw, and what it threw away
        run: |
          python scripts/menu-coverage.py collect
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("enrichment-output/menu-summary.json").read_text())
          for shop in summary.get("perShop", []):
              print("=" * 72)
              print(shop.get("shop"), "|", shop.get("licence"))
              for key in ("status", "menuLink", "landedOn", "landedOnProductPage",
                          "payloads", "productArrays", "productsSeen", "declaredTotal",
                          "flower", "scrollRounds", "hitScrollCap", "hitScrollBudget",
                          "settled", "ageGate", "usedKnownEndpoint", "categories"):
                  if shop.get(key) is not None:
                      print(f"  {key}: {shop[key]}")
              print(f"  rejected: {shop.get('rejected')}")
              for req in shop.get("requests") or []:
                  print(f"  -- {req['products']:>4} products  {req['method']} {req['url']}")
                  if req.get("body"):
                      print(f"     body: {req['body']}")
              for reason, names in (shop.get("rejectedSample") or {}).items():
                  print(f"  -- dropped as {reason}:")
                  for n in names:
                      print(f"     {n}")

          # Что в итоге легло в данные по этим магазинам: сорт и веса.
          licences = {s.get("licence") for s in summary.get("perShop", [])}
          listings = json.loads(Path("data/flower-listings.json").read_text())
          print("=" * 72)
          for licence in sorted(licences):
              rows = [r for r in listings if r["licenseNumber"] == licence]
              sizes = {}
              for r in rows:
                  for g in r.get("availableSizesGrams") or []:
                      sizes[g] = sizes.get(g, 0) + 1
              print(f"{licence}: {len(rows)} listings, sizes {dict(sorted(sizes.items()))}")
              # Сколько товаров сложилось в одну позицию: строка у нас одна на
              # сорт+бренд, а фильтр магазина считает товары.
              merged = sum(1 for r in rows if len(r.get("availableSizesGrams") or []) > 1)
              print(f"   of them carrying more than one weight: {merged}")
          PY

      - name: The section the daily report would now carry
        run: python scripts/menu-coverage.py report
