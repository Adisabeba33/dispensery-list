name: Coverage probe

# Одноразовая диагностика: три магазина, про которые есть конкретный вопрос.
# Ничего не коммитит и никуда не публикует — только читает и печатает в лог.
# Живёт на ветке и уезжает вместе с ней; запускается пушем, потому что кнопка
# «Run workflow» появляется только у файлов на ветке по умолчанию.
on:
  push:
    branches:
      - claude/menu-coverage
  workflow_dispatch:
    inputs:
      licences:
        description: Лицензии через запятую
        default: OCM-CAURD-24-000116,OCM-CAURD-23-000009,OCM-CAURD-23-000023

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Read the three shops with the diagnostics turned on
        env:
          # Bleu Leaf — полка на 223 позиции, у магазина на сайте больше.
          # Gotham Bowery — ровно 20 позиций. Gotham Buds — ровно 24.
          LICENCES: ${{ inputs.licences || 'OCM-CAURD-24-000116,OCM-CAURD-23-000009,OCM-CAURD-23-000023' }}
        run: node scripts/menu-render.mjs --only "$LICENCES" --dump-products 25

      - name: What the collector saw, and what it threw away
        run: |
          python scripts/menu-coverage.py collect
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("enrichment-output/menu-summary.json").read_text())
          for shop in summary.get("perShop", []):
              print("=" * 72)
              print(shop.get("shop"), "|", shop.get("licence"))
              for key in ("status", "menuLink", "landedOn", "landedOnProductPage",
                          "payloads", "productArrays", "productsSeen", "declaredTotal",
                          "flower", "scrollRounds", "hitScrollCap", "hitScrollBudget",
                          "settled", "ageGate", "usedKnownEndpoint", "categories"):
                  if shop.get(key) is not None:
                      print(f"  {key}: {shop[key]}")
              print(f"  rejected: {shop.get('rejected')}")
              for reason, names in (shop.get("rejectedSample") or {}).items():
                  print(f"  -- dropped as {reason}:")
                  for n in names:
                      print(f"     {n}")

          # Что в итоге легло в данные по этим магазинам: сорт и веса.
          licences = {s.get("licence") for s in summary.get("perShop", [])}
          rows = [r for r in json.loads(Path("data/flower-listings.json").read_text())
                  if r["licenseNumber"] in licences]
          print("=" * 72)
          sizes = {}
          for r in rows:
              for g in r.get("availableSizesGrams") or []:
                  sizes[g] = sizes.get(g, 0) + 1
          print(f"listings kept for these shops: {len(rows)}")
          print("sizes:", dict(sorted(sizes.items())))
          PY

      - name: The section the daily report would now carry
        run: python scripts/menu-coverage.py report
