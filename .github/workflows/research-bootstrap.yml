name: Research bootstrap

on:
  push:
    branches:
      - agent/research-nyc-westchester
    paths:
      - scripts/research-bootstrap.mjs
      - scripts/compile-research.py
      - .github/workflows/research-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/research-nyc-westchester
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fetch official research sources
        run: node scripts/research-bootstrap.mjs
      - name: Install research parser dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 openpyxl
      - name: Compile registry and municipality datasets
        run: python scripts/compile-research.py
      - name: Install project dependencies
        run: npm ci
      - name: Validate research output
        run: npm run validate
      - name: Commit validated research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dispensaries.json data/municipalities.json data/raw docs/SOURCE_COLUMNS.md docs/RESEARCH_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: publish NYC and Westchester OCM snapshot"
            git push origin HEAD:agent/research-nyc-westchester
          fi
      - name: Upload research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: research-bootstrap
          path: research-output/
          if-no-files-found: error
          retention-days: 7
