name: Menu collect

on:
  push:
    branches:
      - agent/menu-flower-nyc
  workflow_dispatch:
    inputs:
      limit:
        description: How many reachable shops to visit
        default: '40'

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      # Cheap and first: six minutes of browser time is wasted if the parser
      # cannot map a payload it has already been shown.
      - name: Check the parser against captured payload shapes
        run: node scripts/menu-parse-check.mjs
      - name: Install Playwright
        # Not a project dependency: it exists for this job alone, and keeping it
        # out of package.json stops every Vercel build fetching browsers.
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      # Proves the browser path before it is pointed at real shops: the age
      # affirmation, the menu link, and capturing the JSON the page fetches.
      - name: Check the collector against a fixture storefront
        run: node scripts/menu-e2e-check.mjs
      - name: Read flower off a pilot set of menus
        run: node scripts/menu-render.mjs --limit ${{ inputs.limit || '40' }}
      - name: Validate collected listings
        id: validate
        continue-on-error: true
        run: |
          set +e
          npm run validate > /tmp/validate.txt 2>&1
          echo $? > /tmp/validate.code
      - name: Commit collected listings
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flower-listings.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # A collection run writes back to the branch it was dispatched on, so
          # dispatching it on the default branch would put an unreviewed bot
          # commit straight onto what Vercel deploys. Collection belongs on a
          # branch; the shelves reach main through a merge someone looked at.
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Refusing to commit to the default branch. Re-run this on a working branch."
            exit 1
          fi
          git commit -m "menu: collect flower listings from pilot shops"
          git push origin HEAD:${{ github.ref_name }}
      # Everything worth reading goes last, smallest first: a long report ahead
      # of an error message hides the error, which has happened twice already.
      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = 'enrichment-output/menu-summary.json'
          if not os.path.exists(path):
              print('The collector wrote no summary — it failed before finishing.')
              raise SystemExit(0)
          s = json.load(open(path))
          shops = s.pop('perShop', [])
          print(json.dumps(s, indent=2)[:3000])

          print('\n--- per shop ---')
          for r in shops:
              if r.get('status') == 'robots-disallowed':
                  continue
              gate = 'gate' if r.get('ageGate') else '    '
              link = r.get('menuLink', '?')
              known = '*' if r.get('usedKnownEndpoint') else ' '
              print(f"{str(r.get('status'))[:26]:27} {gate} link={link:<18}{known} "
                    f"seen={r.get('productsSeen', 0):<5} flower={r.get('flower', 0):<4} "
                    f"{r.get('shop', '')[:30]}")
              if r.get('rejected'):
                  print(f"    dropped: {r['rejected']}")
              # The categories a flowerless shop does publish are the finding:
              # they say what word the filter should have been looking for.
              if r.get('categories') and not r.get('flower'):
                  print(f"    categories: {'; '.join(r['categories'][:6])}")
          PY
          echo "--- validation ---"
          sed -n '/^ERRORS/,$p' /tmp/validate.txt 2>/dev/null | head -40 || true
          tail -2 /tmp/validate.txt 2>/dev/null || echo "validation did not run"
          exit $(cat /tmp/validate.code 2>/dev/null || echo 1)
