name: Menu collect

on:
  push:
    branches:
      - agent/menu-flower-nyc
  workflow_dispatch:
    inputs:
      limit:
        description: How many reachable shops to visit
        default: '40'
      skip_collected:
        description: Skip shops whose shelf is already collected
        type: boolean
        default: false
      only_endpoints:
        description: Visit only shops with a researched menu address
        type: boolean
        default: false
      offset:
        description: Skip this many candidates first, to continue a batched sweep
        default: '0'
      only:
        description: Visit one licence number only (diagnosis)
        default: ''
      dump_products:
        description: Write this many raw flower products into the report
        default: '0'
      dump_links:
        description: Report this many scored menu links per shop (chain diagnosis)
        default: '0'
      dump_shapes:
        description: Describe the payloads of shops we recognised nothing in
        default: '0'

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      # Cheap and first: six minutes of browser time is wasted if the parser
      # cannot map a payload it has already been shown.
      - name: Check the parser against captured payload shapes
        run: node scripts/menu-parse-check.mjs
      - name: Install Playwright
        # Not a project dependency: it exists for this job alone, and keeping it
        # out of package.json stops every Vercel build fetching browsers.
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      # Proves the browser path before it is pointed at real shops: the age
      # affirmation, the menu link, and capturing the JSON the page fetches.
      - name: Check the collector against a fixture storefront
        run: node scripts/menu-e2e-check.mjs
      - name: Read flower off a pilot set of menus
        run: >-
          node scripts/menu-render.mjs
          --limit ${{ inputs.limit || '40' }}
          ${{ inputs.offset != '0' && format('--offset {0}', inputs.offset) || '' }}
          ${{ inputs.skip_collected && '--skip-collected' || '' }}
          ${{ inputs.only_endpoints && '--only-endpoints' || '' }}
          ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
          ${{ inputs.dump_products != '0' && format('--dump-products {0}', inputs.dump_products) || '' }}
          ${{ inputs.dump_links != '0' && format('--dump-links {0}', inputs.dump_links) || '' }}
          ${{ inputs.dump_shapes != '0' && format('--dump-shapes {0}', inputs.dump_shapes) || '' }}
      - name: Validate collected listings
        id: validate
        continue-on-error: true
        run: |
          set +e
          npm run validate > /tmp/validate.txt 2>&1
          code=$?
          echo $code > /tmp/validate.code
          # The step's own outcome only says the command ran, and `set +e` makes
          # that always true — so the commit gate was reading "success" from a
          # validator that had failed, and eight bad records were published.
          # The verdict has to travel as a value.
          echo "passed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Commit collected listings
        # A one-shop diagnostic run must not rewrite the shelf file: it visited
        # one shop, and committing that would republish the whole dataset off
        # the back of a debugging run.
        if: steps.validate.outputs.passed == 'true' && inputs.only == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flower-listings.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # A collection run writes back to the branch it was dispatched on, so
          # dispatching it on the default branch would put an unreviewed bot
          # commit straight onto what Vercel deploys. Collection belongs on a
          # branch; the shelves reach main through a merge someone looked at.
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Refusing to commit to the default branch. Re-run this on a working branch."
            exit 1
          fi
          git commit -m "menu: collect flower listings from pilot shops"

          # A collection run takes minutes, and anything pushed to the branch
          # meanwhile makes this push a non-fast-forward — which threw away a
          # run that had already read sixteen shops. The only local change is
          # one data file, so replaying it onto whatever arrived is safe.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "Push rejected; rebasing onto the branch as it now stands (attempt $attempt)."
            git fetch origin ${{ github.ref_name }}
            git rebase FETCH_HEAD || {
              echo "::error::Could not replay the collected listings onto the branch."
              git rebase --abort || true
              exit 1
            }
          done
          echo "::error::Push kept being rejected; the collected listings were not saved."
          exit 1
      # Everything worth reading goes last, smallest first: a long report ahead
      # of an error message hides the error, which has happened twice already.
      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = 'enrichment-output/menu-summary.json'
          if not os.path.exists(path):
              print('The collector wrote no summary — it failed before finishing.')
              raise SystemExit(0)
          s = json.load(open(path))
          shops = s.pop('perShop', [])
          print(json.dumps(s, indent=2)[:3000])

          print('\n--- per shop ---')
          for r in shops:
              if r.get('status') == 'robots-disallowed':
                  continue
              gate = 'gate' if r.get('ageGate') else '    '
              link = r.get('menuLink', '?')
              known = '*' if r.get('usedKnownEndpoint') else ' '
              print(f"{str(r.get('status'))[:26]:27} {gate} link={link:<18}{known} "
                    f"seen={r.get('productsSeen', 0):<5} flower={r.get('flower', 0):<4} "
                    f"{r.get('shop', '')[:30]}")
              if r.get('landedOn'):
                  print(f"    landed on {r['landedOn']}  ({r.get('payloads', 0)} payloads, "
                        f"{r.get('scrollRounds', 0)} scroll rounds)")
              if r.get('settled') is False:
                  print('    still fetching when the cap was reached')
              if r.get('hitScrollCap') or r.get('hitScrollBudget'):
                  print('    STOPPED SCROLLING WITH THE MENU STILL GROWING — this shelf is short')
              if r.get('declaredTotal') and r['declaredTotal'] > r.get('productsSeen', 0):
                  print(f"    the menu says {r['declaredTotal']} products, we read {r.get('productsSeen', 0)}")
              if r.get('topLevelKeys'):
                  print(f"    payload top-level keys: {r['topLevelKeys']}")
              for shape in r.get('shapes', []):
                  print(f"    SHAPE {shape}")
              for link in r.get('links', []):
                  print(f"    LINK {link}")
              for sample in r.get('sample', []):
                  print(f"    RAW {sample}")
              if r.get('rejected'):
                  print(f"    dropped: {r['rejected']}")
              # Named, not just counted: a shelf that comes up short is diagnosed
              # by reading what was thrown away against the shop's own website.
              for verdict, names in (r.get('rejectedSample') or {}).items():
                  print(f"    dropped as {verdict}:")
                  for n in names:
                      print(f"      - {n}")
              # The categories a flowerless shop does publish are the finding:
              # they say what word the filter should have been looking for.
              if r.get('categories') and not r.get('flower'):
                  print(f"    categories: {'; '.join(r['categories'][:6])}")
          PY
          echo "--- validation ---"
          sed -n '/^ERRORS/,$p' /tmp/validate.txt 2>/dev/null | head -40 || true
          tail -2 /tmp/validate.txt 2>/dev/null || echo "validation did not run"
          exit $(cat /tmp/validate.code 2>/dev/null || echo 1)
