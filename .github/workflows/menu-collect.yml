name: Menu collect

on:
  push:
    branches:
      - agent/menu-flower-nyc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Read flower off a pilot set of menus
        run: node scripts/menu-render.mjs --limit 12
      - name: Validate collected listings
        run: npm run validate
      - name: Commit collected listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flower-listings.json
          if ! git diff --cached --quiet; then
            git commit -m "menu: collect flower listings from pilot shops"
            git push origin HEAD:agent/menu-flower-nyc
          fi
      - name: Report what was collected
        if: always()
        run: cat enrichment-output/menu-summary.json
