name: Menu collect

on:
  push:
    branches:
      - agent/menu-flower-nyc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Collect flower from real menus
        run: python scripts/menu-collect.py --limit 120
      - name: Install project dependencies
        run: npm ci
      - name: Validate collected listings
        run: npm run validate
      - name: Commit collected listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flower-listings.json
          if ! git diff --cached --quiet; then
            git commit -m "menu: collect flower listings from shop menus"
            git push origin HEAD:agent/menu-flower-nyc
          fi
      - name: Report what was collected
        if: always()
        run: cat enrichment-output/menu-summary.json
