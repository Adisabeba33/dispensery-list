name: Undercut probe

# Разовая диагностика восьми магазинов, которые отдают заметно меньше, чем
# объявляют, и которым листание не помогло: в их запросе не нашлось ничего
# похожего на номер страницы. Нужно увидеть, что они шлют на самом деле.
# Ничего не коммитит. Живёт на ветке и уезжает вместе с ней.
on:
  push:
    branches:
      - claude/probe-undercut
    paths:
      - .github/workflows/menu-probe-undercut.yml
  workflow_dispatch:
    inputs:
      licences:
        description: Лицензии через запятую
        default: OCM-CAURD-25-000229,OCM-CAURD-24-000131,OCM-RETL-26-000511,OCM-CAURD-24-000196,OCM-CAURD-24-000094

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Read the eight with the requests written down
        env:
          # Три магазина со скриншотов: OC Dispensary (у нас 14 по половинке,
          # на сайте около 50) и обе Hibernica (у нас 10, на сайте 15) — все
          # три в базе с 16 сентября, то есть последние прогоны их не читали.
          # Плюс Fireleaf и Misha's, чтобы видеть, помогла ли им починка.
          LICENCES: ${{ inputs.licences || 'OCM-CAURD-25-000229,OCM-CAURD-24-000131,OCM-RETL-26-000511,OCM-CAURD-24-000196,OCM-CAURD-24-000094' }}
        run: node scripts/menu-render.mjs --only "$LICENCES" --dump-requests 3

      - name: What each of them actually asks for
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("enrichment-output/menu-summary.json").read_text())
          for shop in summary.get("perShop", []):
              print("=" * 72)
              print(shop.get("shop"), "|", shop.get("licence"))
              for key in ("status", "menuLink", "landedOn", "productsSeen", "declaredTotal",
                          "flower", "scrollRounds", "pagesAsked", "pagedFrom", "pagedTo",
                          "pagingIgnored", "pagingRefused", "hitPagingBudget",
                          "usedKnownEndpoint"):
                  if shop.get(key) is not None:
                      print(f"  {key}: {shop[key]}")
              for req in shop.get("requests") or []:
                  print(f"  -- {req['products']:>4} products  {req['method']} {req['url']}")
                  if req.get("headerNames"):
                      print(f"     headers: {req['headerNames']}")
                  if req.get("body"):
                      print(f"     body: {req['body']}")
          PY
