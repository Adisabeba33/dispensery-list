name: ZIP centroids

# Run by hand. The Census gazetteer changes once a year at most, and the file
# it produces is committed, so there is nothing to schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check requests
      - name: Fetch ZIP centroids
        run: python scripts/fetch-zip-centroids.py
      - name: Validate
        run: npm run validate
      - name: Commit
        run: |
          if git diff --quiet -- data/zip-centroids.json; then
            echo "Centroids unchanged."
            exit 0
          fi
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Refusing to commit to the default branch. Re-run this on a working branch."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zip-centroids.json
          git commit -m "data: ZIP centroids from the US Census gazetteer"
          git push origin HEAD:${{ github.ref_name }}
