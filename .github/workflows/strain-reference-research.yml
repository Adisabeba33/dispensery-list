name: Strain reference research

on:
  push:
    branches:
      - agent/menu-endpoints-nyc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate repository data
        run: npm run validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rank brands and strains
        run: python scripts/strain-reference-priority.py
      - name: Upload research priority
        uses: actions/upload-artifact@v4
        with:
          name: strain-reference-priority
          path: enrichment-output/strain-reference-priority.json
          if-no-files-found: error
          retention-days: 7
